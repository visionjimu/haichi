.warn{color:#A65A00}
.in{width:100%;height:36px;border:1.5px solid var(--line);border-radius:4px;padding:0 10px;font-size:14px;color:var(--ink);background:#fff}
.in:focus{border-color:var(--sel);outline:none;box-shadow:0 0 0 2px var(--selbg)}
.in.num{width:56px;height:34px;padding:0 6px}
textarea.in{height:auto;min-height:120px;padding:8px 10px;line-height:1.6;resize:vertical}
.tabs{display:flex;gap:0;border-bottom:1.5px solid var(--line);margin-top:12px}
.tab{height:36px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:-1.5px}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.catpick{border:0;background:none;padding:2px;cursor:pointer;border-radius:4px}
.catpick.on .tag{box-shadow:0 0 0 2px var(--sel)}
.chks{display:flex;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden;height:36px}
.segb{border:0;background:#fff;padding:0 14px;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer}
.segb.on{background:var(--navy);color:#fff}
.chkrow{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:13px;cursor:pointer}
.chkrow input{width:16px;height:16px;accent-color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--danger);font-weight:700;font-size:12.5px;margin:12px 0 0}
.note{color:var(--ink2);font-size:12px;margin:8px 0 0}
.sec{margin:20px 0 8px;font-size:14px;font-weight:700}
.rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .in{flex:1;min-width:120px;height:34px}
.rowmeta{font-size:12px;color:var(--ink2);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.sw{width:34px;height:34px;border:1.5px solid var(--line);border-radius:4px;padding:2px;background:#fff;cursor:pointer}
.clr{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
.clr input[type=color]{width:30px;height:30px;border:1.5px solid var(--line);border-radius:4px;padding:2px;background:#fff;cursor:pointer}
.dz{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filebtn{position:relative;cursor:pointer}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.filebtn:focus-within{outline:2px solid var(--sel);outline-offset:2px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--navy)}
.loglist{list-style:none;margin:8px 0 0;padding:0}
.loglist li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.loglist time{color:var(--ink2);font-size:12px;flex:0 0 76px;font-variant-numeric:tabular-nums}
.snap{border:1.5px solid var(--line);border-radius:5px;padding:10px 12px;margin-top:8px}
.snap-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.snap-h b{flex:1;min-width:140px}
.diff{margin:10px 0 0;padding:10px 12px;background:#F2F4F6;border:1px solid var(--line2);border-radius:4px;font-size:12.5px;white-space:pre-wrap;line-height:1.7}
.center{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--ink2)}
.help h3{margin:18px 0 6px;font-size:13.5px;font-weight:700;color:var(--navy);padding-left:8px;border-left:3px solid var(--navy)}
.help ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75}
.help kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:12px;background:#F7F8FA}
@media (prefers-reduced-motion:reduce){.tag{transition:none}}
@media (max-width:640px){
  .sb{padding:12px 10px 170px}
  .save{margin-left:0}
  .srch{flex:1 1 100%}.srch input{width:100%}
  .lg-hint{margin-left:0}
  .two{grid-template-columns:1fr}
}
.print-head{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  .sb{padding:0;background:#fff;min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hd,.tb,.banner,.selbar,.toast,.tip,.tag-edit,.tag-check,.into-lbl,.ib.sm,.ov,.lg-hint,.tabs-bar{display:none !important}
  .lg{border:0;padding:0;background:none;margin:0 0 6px;zoom:.82}
  .chip{background:#fff !important;color:var(--ink) !important;border-color:var(--line) !important}
  .print-head{display:flex;align-items:baseline;gap:14px;margin:0 0 6px;font-size:12px;color:var(--ink2)}
  .print-head b{font-size:16px;color:var(--ink)}
  .sheet-wrap{border-radius:0;border-color:var(--vline);zoom:.82 !important}
  .sh-corner,.sh-cat,.sh-store{position:static}
  .sh-cell,.sh-store,.sh-cat,.sh-corner{page-break-inside:avoid;break-inside:avoid}
  .slot-empty{border-color:#E4E8EE}
  .tag{box-shadow:none}
  .tag.is-dim{opacity:1}
}
